---
name: Build container image
on:
  pull_request:
    branches:
      - main
  schedule:
    - cron: '05 10 * * *'  # 10:05am UTC everyday
  push:
    branches:
      - main
    paths-ignore:
      - '**/README.md'
  workflow_dispatch:

env:
  IMAGE_REGISTRY: "ghcr.io/${{ github.repository_owner }}"  # do not edit

concurrency:
  group: ${{ github.workflow }}-${{ github.ref || github.run_id }}-${{ inputs.brand_name}}-${{ inputs.stream_name }}
  cancel-in-progress: true

jobs:
  build_push:
    name: Build and push image
    runs-on: ubuntu-26.04

    permissions:
      contents: read
      packages: write
      id-token: write

    steps:
      # These stage versions are pinned by https://github.com/renovatebot/renovate
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          # system_files/usr/share/grub is tracked by Git LFS; without this the build
          # copies pointer text instead of images (build.sh fails loudly on that)
          lfs: true

      - name: Maximize build space
        uses: ublue-os/remove-unwanted-software@695eb75bc387dbcd9685a8e72d23439d8686cba6

      - name: Install just
        uses: extractions/setup-just@53165ef7e734c5c07cb06b3c8e7b647c5aa16db3 #v4.0.0

      - name: Check Just Syntax
        shell: bash
        run: |
          just check

      - name: Image Name
        id: image-name
        run: |
          IMAGE_NAME=$(just image_name)

          echo "IMAGE_NAME=${IMAGE_NAME}" >> $GITHUB_ENV

      - name: Default Tag
        id: gen-default-tag
        run: |
          DEFAULT_TAG=$(just generate-default-tag)

          echo "DEFAULT_TAG=${DEFAULT_TAG}" >> $GITHUB_ENV

      - name: Prepare environment
        run: |
          # Lowercase the image uri https://github.com/macbre/push-to-ghcr/issues/12
          echo "IMAGE_REGISTRY=${IMAGE_REGISTRY,,}" >> ${GITHUB_ENV}
          echo "IMAGE_NAME=${IMAGE_NAME,,}" >> ${GITHUB_ENV}

      # Resolve the upstream rpm URLs with the workflow token and pass them to the
      # build as build args. Anonymous calls to api.github.com are limited to 60
      # req/h per shared runner IP, which randomly fails the build with HTTP 403.
      # The token itself never enters the build container or the image.
      - name: Resolve upstream RPM URLs
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail

          api() {
            curl -fsSL --retry 3 --retry-all-errors \
              -H "Authorization: Bearer ${GH_TOKEN}" \
              -H 'Accept: application/vnd.github+json' "$1"
          }

          clash_url="$(api https://api.github.com/repos/clash-verge-rev/clash-verge-rev/releases/latest |
            jq -er '[.assets[] | select(.name | test("\\.(x86_64|amd64|x64)\\.rpm$"; "i"))][0].browser_download_url')"

          case "$(uname -m)" in
            x86_64)  rpmarch=x64 ;;
            aarch64) rpmarch=arm64 ;;
            *)
              echo "v2rayA rpm 不支持的运行器架构：$(uname -m)" >&2
              exit 1
              ;;
          esac
          v2raya_tag="$(api https://api.github.com/repos/v2rayA/v2rayA/releases/latest | jq -er .tag_name)"
          v2raya_url="https://github.com/v2rayA/v2rayA/releases/download/${v2raya_tag}/installer_redhat_${rpmarch}_${v2raya_tag#v}.rpm"

          echo "CLASH_VERGE_RPM_URL=${clash_url}" >> "${GITHUB_ENV}"
          echo "V2RAYA_RPM_URL=${v2raya_url}" >> "${GITHUB_ENV}"
          echo "Clash Verge 安装包地址：${clash_url}"
          echo "v2rayA 安装包地址：${v2raya_url}"

      # This actually builds the container image
      - name: Build Image
        id: build-image
        run: |
          just build \
            ${IMAGE_NAME} \
            ${DEFAULT_TAG}

      # `just build` records the version it picked (including the .tN build serial) in
      # output.env; expose it so the tag/generate steps below reuse the same value.
      - name: Export image version
        run: |
          test -f output.env
          cat output.env >> "${GITHUB_ENV}"
          echo "构建版本：${IMAGE_VERSION}"

      # This is optional, this provides smaller delta updates
      - name: Rechunk with rpm-ostree
        id: rechunk
        run: |
          just ostree-rechunk \
            ${IMAGE_NAME} \
            ${DEFAULT_TAG}

      # If you are feeling adventurous, use the new distro agnostic rechunker
      # https://github.com/coreos/chunkah
      # You can delete the Rechunk with rpm-ostree portion then if you use this
      #- name: Rechunk with Chunkah
      #  id: rechunk
      #  run: |
      #    just rechunk \
      #      ${IMAGE_NAME} \
      #      ${DEFAULT_TAG}

      - name: Generate Build Tags
        id: gen-build-tags
        run: |
          alias_tags="$(just generate-build-tags \
                        ${IMAGE_NAME} \
                        ${DEFAULT_TAG})"

          echo "本次 Action 的标签..."
          echo "${alias_tags}"
          echo "alias_tags=${alias_tags}" >> $GITHUB_OUTPUT

      - name: Tag Image
        id: tag-images
        env:
          ALIAS_TAGS: ${{ steps.gen-build-tags.outputs.alias_tags }}
        run: |
          just tag-images \
            "${IMAGE_NAME}" \
            "${DEFAULT_TAG}" \
            "${ALIAS_TAGS}"

      # These `if` statements are so that pull requests for your custom images do not make it publish any packages under your name without you knowing
      # They also check if the runner is on the default branch so that things like the merge queue (if you enable it), are going to work
      - name: Login to GitHub Container Registry
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        if: github.event_name != 'pull_request' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Push To GHCR
        if: github.event_name != 'pull_request' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
        id: push-image
        env:
          ALIAS_TAGS: ${{ steps.gen-build-tags.outputs.alias_tags }}
        run: |
          set -euox pipefail
          # The rechunker (rpm-ostree compose build-chunked-oci) always emits gzip
          # layers. Recompress to zstd at push time so the published image matches
          # the upstream base image and keeps downloads/delta updates smaller.
          # --force-compression recompresses even if the destination already holds
          # a differently-compressed variant of a layer.
          #
          # Recompressing a layer drops its ostree.components annotation, so the
          # first tag pushed below would be published without those annotations.
          # Push that tag once more at the end: the zstd blobs now exist and are
          # reused, and the reuse path keeps the annotations intact.
          first_tag="${ALIAS_TAGS%% *}"
          for tag in ${ALIAS_TAGS}; do
            podman push --digestfile=/tmp/digestfile \
              --compression-format=zstd \
              --compression-level=3 \
              --force-compression \
              ${IMAGE_NAME}:${tag} ${IMAGE_REGISTRY}/${IMAGE_NAME}:${tag}
          done

          podman push --digestfile=/tmp/digestfile \
            --compression-format=zstd \
            --compression-level=3 \
            --force-compression \
            ${IMAGE_NAME}:${first_tag} ${IMAGE_REGISTRY}/${IMAGE_NAME}:${first_tag}

          digest=$(< /tmp/digestfile)

          echo "digest=${digest}" >> $GITHUB_OUTPUT

      # This section is optional and only needs to be enabled if you plan on distributing
      # your project for others to consume. You will need to create a public and private key
      # using Cosign and save the private key as a repository secret in Github for this workflow
      # to consume. For more details, review the image signing section of the README.
      - name: Install Cosign
        uses: sigstore/cosign-installer@756fe2d284c7292c4e9b62c8a28f1e5629c59532 # v4.1.3
        if: github.event_name != 'pull_request' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
        with:
          # be careful when upgrading major versions
          cosign-release: 'v3.1.4'

      - name: Sign container image
        id: sign-image
        if: github.event_name != 'pull_request' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
        env:
          COSIGN_EXPERIMENTAL: false
          COSIGN_PRIVATE_KEY: ${{ secrets.SIGNING_SECRET }}
          DIGEST: ${{ steps.push-image.outputs.digest }}
        run: |
          # https://github.com/containers/container-libs/issues/388
          # https://github.com/coreos/rpm-ostree/issues/5509
          # use old bundle format, so we can use newer cosign 3.X.X instead of 2.X.X
          cosign sign -y --new-bundle-format=false --use-signing-config=false --key env://COSIGN_PRIVATE_KEY ${IMAGE_REGISTRY}/${IMAGE_NAME}@${DIGEST}

